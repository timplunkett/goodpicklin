<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- if page.noindex %}
  <meta name="robots" content="noindex">
  {%- endif %}
  {% seo %}
  <meta name="theme-color" content="#2f5d1e">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  {%- for stylesheet in page.stylesheets %}
  <link rel="stylesheet" href="{{ stylesheet | relative_url }}">
  {%- endfor %}
</head>
<body class="{{ page.body_class }}">
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">
        {{ site.title }}
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="{{ '/levels' | relative_url }}"{% if page.url == '/levels' %} aria-current="page"{% endif %}>Skill level</a>
        <a class="button button--small" href="{{ site.signup_url }}">Sign up</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>{{ site.title }} · {{ site.tagline }}</p>
      <p>Sign-ups are handled on <a href="{{ site.signup_url }}">Ballers</a>.</p>
    </div>
  </footer>
  {%- for script in page.scripts %}
  <script src="{{ script | relative_url }}"></script>
  {%- endfor %}
</body>
</html>
